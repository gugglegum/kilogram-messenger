[package]
name = "kilogram-cli"
description = "Kilogram P2P protocol proof of concept"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
sync-v2-evidence = ["dep:ed25519-dalek"]

[[bin]]
name = "kilogram-sync-v2-evidence"
path = "src/bin/kilogram-sync-v2-evidence.rs"
required-features = ["sync-v2-evidence"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
clap.workspace = true
getrandom.workspace = true
image.workspace = true
iroh.workspace = true
kilogram-crypto = { path = "../../crates/kilogram-crypto" }
kilogram-identity = { path = "../../crates/kilogram-identity" }
kilogram-mailbox = { path = "../../crates/kilogram-mailbox" }
kilogram-mailbox-client = { path = "../../crates/kilogram-mailbox-client" }
kilogram-mailbox-provisioning = { path = "../../crates/kilogram-mailbox-provisioning" }
kilogram-peer-capability-store = { path = "../../crates/kilogram-peer-capability-store" }
kilogram-protocol = { path = "../../crates/kilogram-protocol" }
kilogram-publication-conflict = { path = "../../crates/kilogram-publication-conflict" }
kilogram-ratchet = { path = "../../crates/kilogram-ratchet" }
kilogram-rollout = { path = "../../crates/kilogram-rollout" }
kilogram-runtime-ipc = { path = "../../crates/kilogram-runtime-ipc" }
kilogram-session = { path = "../../crates/kilogram-session" }
kilogram-sync-capability = { path = "../../crates/kilogram-sync-capability" }
kilogram-state = { path = "../../crates/kilogram-state" }
kilogram-store = { path = "../../crates/kilogram-store" }
kilogram-ticket-publication = { path = "../../crates/kilogram-ticket-publication" }
kilogram-ticket-store = { path = "../kilogram-ticket-store" }
kilogram-transport-iroh = { path = "../../crates/kilogram-transport-iroh" }
postcard.workspace = true
qrcode.workspace = true
redb.workspace = true
reqwest.workspace = true
rqrr.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
zeroize.workspace = true
ed25519-dalek = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation_Collections", "Networking_Connectivity", "System_Power"] }

[dev-dependencies]
ed25519-dalek.workspace = true
kilogram-offline = { path = "../kilogram-offline" }

[lints]
workspace = true
