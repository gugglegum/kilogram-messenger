name: Bug report
description: Report a reproducible Kilogram defect that is not a security vulnerability
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Kilogram is an experimental technical proof of concept. For a suspected vulnerability, stop here and use the private reporting link in SECURITY.md.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find this defect.
          required: true
        - label: This report contains no seed phrase, private key, IPC bearer, personal message, or exploitable security detail.
          required: true
        - label: This is not a request for production-security assurance.
          required: true
  - type: input
    id: revision
    attributes:
      label: Commit, tag, or executable hash
      description: Identify the exact source or binary that exhibited the problem.
      placeholder: M1.0.1, commit SHA, or SHA-256
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 x86_64
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Explain what you expected, what happened, and whether the result is repeatable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe sequence of commands or UI actions. Redact secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only the relevant bounded output after checking it for secrets and identifiers.
      render: text
  - type: textarea
    id: network
    attributes:
      label: Network and process context
      description: Note VPN, NAT, relay policy, firewall, sleep/restart, and which processes or physical hosts were involved, when relevant.
