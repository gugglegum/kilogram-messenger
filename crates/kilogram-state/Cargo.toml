[package]
name = "kilogram-state"
description = "Crash-consistent local state transactions for Kilogram"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Explicit opt-in for offline Windows verification; not part of default builds.
verification-state-lock-adoption = ["dep:winapi-util"]

[dependencies]
argon2.workspace = true
base64.workspace = true
blake3.workspace = true
chacha20poly1305 = "0.10"
getrandom.workspace = true
postcard.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
stellar-agent-windows-identity = "=0.1.0-alpha.12"
winapi-util = { version = "=0.1.11", optional = true }

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
