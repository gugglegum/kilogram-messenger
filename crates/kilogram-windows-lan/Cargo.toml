[package]
name = "kilogram-windows-lan"
description = "Windows FFI boundary for scoped LAN discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
native-feasibility = []

[target.'cfg(windows)'.dependencies]
anyhow.workspace = true
kilogram-protocol = { path = "../kilogram-protocol" }
windows = { version = "0.62.2", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_IO",
] }

# The workspace forbids unsafe. This adapter permits audited FFI only in native.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
