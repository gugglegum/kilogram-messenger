[package]
name = "kilogram-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kilogram-protocol = { path = "../crates/kilogram-protocol", features = ["decoder-fuzzing"] }

[[bin]]
name = "canonical_sync_v2_decoders"
path = "fuzz_targets/canonical_sync_v2_decoders.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
