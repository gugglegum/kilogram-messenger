[workspace]
members = [
    "apps/kilogram-cli",
    "crates/kilogram-identity",
    "crates/kilogram-protocol",
    "crates/kilogram-session",
    "crates/kilogram-store",
    "crates/kilogram-transport-iroh",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "3.0"
getrandom = "0.4"
iroh = "1.0.3"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
