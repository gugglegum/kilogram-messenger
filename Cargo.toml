[workspace]
members = [
    "apps/kilogram-cli",
    "crates/kilogram-crypto",
    "crates/kilogram-identity",
    "crates/kilogram-protocol",
    "crates/kilogram-ratchet",
    "crates/kilogram-session",
    "crates/kilogram-state",
    "crates/kilogram-store",
    "crates/kilogram-transport-iroh",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5.3"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "3.0"
getrandom = "0.4"
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
iroh = "1.0.3"
postcard = { version = "1.1", features = ["alloc"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
redb = "4.2"
rqrr = { version = "0.10.1", default-features = false, features = ["img"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
vodozemac = "0.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
